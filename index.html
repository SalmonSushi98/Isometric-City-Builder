<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Isometric City Builder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== 좌측 UI ===== -->
  <div id="ui">

    <!-- 상위 카테고리 -->
    <button class="category-btn" onclick="toggleCategory('tile')">타일</button>
    <div id="tile" class="subcategory">
      <img class="item" src="assets/tiles/road_WDL.png"
          onclick="selectItem('tile', 0, this)" />

      <img class="item" src="assets/tiles/road_WL.png"
          onclick="selectItem('tile', 1, this)" />

      <img class="item" src="assets/tiles/road_YL.png"
          onclick="selectItem('tile', 2, this)" />

      <img class="item" src="assets/tiles/road-sidewalk.png"
          onclick="selectItem('tile', 3, this)" />

      <img class="item" src="assets/tiles/bush.png"
          onclick="selectItem('tile', 4, this)" />

      <img class="item" src="assets/tiles/road_WDL_curved.png"
          onclick="selectItem('tile', 5, this)" />

      <img class="item" src="assets/tiles/road_WL_curved.png"
          onclick="selectItem('tile', 6, this)" />

      <img class="item" src="assets/tiles/road_YL_curved.png"
          onclick="selectItem('tile', 7, this)" />

      <img class="item" src="assets/tiles/road-bush.png"
          onclick="selectItem('tile', 8, this)" />

      <img class="item" src="assets/tiles/road-sidewalk_curved.png"
          onclick="selectItem('tile', 9, this)" />

      <img class="item" src="assets/tiles/road-sidewalk_edge.png"
          onclick="selectItem('tile', 10, this)" />

      <img class="item" src="assets/tiles/road-bush_curved.png"
          onclick="selectItem('tile', 11, this)" />

      <img class="item" src="assets/tiles/road-bush_edge.png"
          onclick="selectItem('tile', 12, this)" />
    </div>


    <button class="category-btn" onclick="toggleCategory('housing')">주택</button>
    <div id="housing" class="subcategory">
      <img class="item" src="assets/buildings/house.png"
          onclick="selectItem('housing', 0, this)" />

      <img class="item" src="assets/buildings/apartment.png"
          onclick="selectItem('housing', 1, this)" />
    </div>

    <button class="category-btn" onclick="toggleCategory('commercial')">상가</button>
    <div id="commercial" class="subcategory"></div>

    <button class="category-btn" onclick="toggleCategory('public')">관공서</button>
    <div id="public" class="subcategory"></div>

    <button class="category-btn" onclick="toggleCategory('industry')">산업시설</button>
    <div id="industry" class="subcategory"></div>

    <button class="category-btn" onclick="toggleCategory('etc')">기타</button>
    <div id="etc" class="subcategory"></div>

    <!-- 지우개 (독립 버튼) -->
    <button class="eraser-btn" onclick="selectEraser()">지우개</button>

    <!-- 하단 버튼 -->
    <div id="bottom-buttons">
      <button title="저장" onclick="saveCity()">💾</button>
      <button title="불러오기" onclick="loadCity()">📂</button>
      <button title="캡쳐" onclick="captureCity()">📸</button>
    </div>

  </div>

  <!-- ===== 캔버스 ===== -->
  <canvas id="gameCanvas"></canvas>

  <!-- JS -->
  <script src="main.js"></script>
</body>
</html>
